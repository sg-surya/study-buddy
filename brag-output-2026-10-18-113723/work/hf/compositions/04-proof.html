<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #fffcf8;
        }
        #root .s4bg {
          position: absolute;
          inset: 0;
          background-color: #fffcf8;
        }
        #root .shot {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #root .tall {
          position: absolute;
          left: 0;
          top: -60px;
          width: 1920px;
          height: auto;
          display: block;
        }
        #root #pg3 {
          position: absolute;
          background: #ffffff;
          overflow: hidden;
        }
        #root #pg3 img {
          display: block;
          width: 100%;
          height: 100%;
        }
        #root #flash {
          position: absolute;
          background: #ffffff;
        }
        #root .rip {
          position: absolute;
          width: 100px;
          height: 100px;
          border-radius: 50%;
          border: 5px solid;
        }
        #root .cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 46px;
          height: 46px;
          filter: drop-shadow(0 4px 10px rgba(32, 28, 25, 0.35));
        }
        #root .cap {
          position: absolute;
          left: 60px;
          bottom: 54px;
          background: #fffcf8;
          border: 1px solid rgba(32, 28, 25, 0.2);
          padding: 14px 26px;
          font-weight: 500;
          font-size: 27px;
          letter-spacing: 0.01em;
          box-shadow: 0 10px 26px rgba(32, 28, 25, 0.16);
        }
      </style>
      <div id="root" data-composition-id="04-proof" data-width="1920" data-height="1080">
        <div class="s4bg hatch"></div>

        <div class="shot" id="s4a" data-layout-allow-overflow><img class="tall" src="assets/04-answer.png" alt="" /></div>

        <div class="shot" id="s4b" data-layout-allow-overflow>
          <img class="tall" src="assets/05-evidence-jump.png" alt="" />
          <div id="pg3" style="left: 1205px; top: 124px; width: 393px; height: 540px">
            <img src="assets/pdfpage3-crop.png" alt="" />
          </div>
          <div id="flash" style="left: 1144px; top: 124px; width: 515px; height: 540px"></div>
        </div>

        <div class="rip" id="rip3" style="left: 452px; top: 575px; border-color: #ff5a1f"></div>
        <svg class="cursor" id="cur4" viewBox="0 0 24 24">
          <path d="M4 2 L20 12 L12.5 13.5 L9.5 21 Z" fill="#ffffff" stroke="#201c19" stroke-width="1.6" stroke-linejoin="round" />
        </svg>

        <div class="cap" id="s4cap">click the proof.</div>
      </div>
      <script>
        gsap.set("#s4b", { opacity: 0 });
        gsap.set("#pg3", { opacity: 0 });
        gsap.set("#flash", { opacity: 0 });
        gsap.set("#s4cap", { opacity: 0 });
        gsap.set("#cur4", { x: 760, y: 1010, opacity: 0 });
        gsap.set("#rip3", { opacity: 0 });

        const tl = gsap.timeline({ paused: true });

        /* cursor to the c2 chip (frame 502,625) */
        tl.fromTo("#cur4", { x: 760, y: 1010, opacity: 0 }, { x: 494, y: 621, opacity: 1, duration: 0.62, ease: "power2.inOut" }, 0.25);
        tl.to("#cur4", { scale: 0.88, duration: 0.07 }, 1.25);
        tl.to("#cur4", { scale: 1, duration: 0.12 }, 1.32);
        tl.fromTo("#rip3", { scale: 0, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.25);
        tl.to("#cur4", { opacity: 0, duration: 0.15 }, 1.7);

        /* crossfade to the jumped viewer; page 3 lands */
        tl.to("#s4a", { opacity: 0, duration: 0.14 }, 2.38);
        tl.to("#s4b", { opacity: 1, duration: 0.14 }, 2.38);
        tl.fromTo("#pg3", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" }, 2.45);
        tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.4, ease: "power2.in" }, 2.44);
        tl.fromTo("#s4b", { scale: 1 }, { scale: 1.03, duration: 2.32, ease: "none", transformOrigin: "73% 36%" }, 2.38);

        /* caption */
        tl.fromTo("#s4cap", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.75);
        tl.to("#s4cap", { opacity: 0, duration: 0.3 }, 4.25);

        window.__timelines["04-proof"] = tl;
      </script>
    </template>
  </body>
</html>
