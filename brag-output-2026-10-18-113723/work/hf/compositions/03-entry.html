<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Anton";
          font-style: normal;
          font-weight: 400;
          src: url("assets/fonts/anton-400.woff2") format("woff2");
        }
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #fffcf8;
        }
        #root .s3bg {
          position: absolute;
          inset: 0;
          background-color: #fffcf8;
        }
        #root .shot {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #root .fit {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #root .tall {
          position: absolute;
          left: 0;
          top: -60px;
          width: 1920px;
          height: auto;
          display: block;
        }
        #root .rip {
          position: absolute;
          width: 100px;
          height: 100px;
          border-radius: 50%;
          border: 5px solid;
        }
        #root .cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 46px;
          height: 46px;
          filter: drop-shadow(0 4px 10px rgba(32, 28, 25, 0.35));
        }
        #root #band {
          position: absolute;
          inset: 0;
          background: #ff5a1f;
          display: grid;
          place-items: center;
        }
        #root #bandtxt {
          font-family: "Anton", sans-serif;
          font-size: 150px;
          color: #ffffff;
          letter-spacing: 0.01em;
        }
      </style>
      <div id="root" data-composition-id="03-entry" data-width="1920" data-height="1080">
        <div class="s3bg hatch"></div>
        <div class="shot" id="s3-hero" data-layout-allow-overflow><img class="fit" src="assets/01-hero.png" alt="" /></div>
        <div class="shot" id="s3-popup" data-layout-allow-overflow><img class="fit" src="assets/02-popup.png" alt="" /></div>
        <div class="shot" id="s3-brief" data-layout-allow-overflow><img class="tall" src="assets/03-notebook-briefing.png" alt="" /></div>

        <div class="rip" id="rip1" style="left: 910px; top: 380px; border-color: rgba(255, 255, 255, 0.95)"></div>
        <div class="rip" id="rip2" style="left: 910px; top: 650px; border-color: rgba(255, 255, 255, 0.95)"></div>

        <svg class="cursor" id="cur3" viewBox="0 0 24 24">
          <path d="M4 2 L20 12 L12.5 13.5 L9.5 21 Z" fill="#ffffff" stroke="#201c19" stroke-width="1.6" stroke-linejoin="round" />
        </svg>

        <div id="band" data-layout-allow-overflow><div id="bandtxt">NOTEBOOK READY</div></div>
      </div>
      <script>
        gsap.set("#s3-popup", { opacity: 0 });
        gsap.set("#s3-brief", { opacity: 0 });
        gsap.set("#band", { xPercent: -100 });
        gsap.set("#bandtxt", { opacity: 0 });
        gsap.set("#rip1, #rip2", { opacity: 0 });
        gsap.set("#cur3", { x: 1560, y: 330, opacity: 0 });

        const tl = gsap.timeline({ paused: true });

        /* hero + cursor to CREATE NOTEBOOK (center 960,430) */
        tl.fromTo("#s3-hero img", { scale: 1.015 }, { scale: 1.05, duration: 1.4, ease: "none" }, 0);
        tl.fromTo("#cur3", { x: 1330, y: 790, opacity: 0 }, { x: 952, y: 426, opacity: 1, duration: 0.55, ease: "power2.inOut" }, 0.15);
        tl.to("#cur3", { scale: 0.88, duration: 0.07 }, 0.7);
        tl.to("#cur3", { scale: 1, duration: 0.12 }, 0.77);
        tl.fromTo("#rip1", { scale: 0, opacity: 0.85 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.7);

        /* popup opens */
        tl.to("#s3-hero", { opacity: 0, duration: 0.12 }, 1.3);
        tl.fromTo("#s3-popup", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 1.3);
        tl.fromTo("#s3-popup img", { scale: 1.03 }, { scale: 1.055, duration: 1.7, ease: "none" }, 1.3);

        /* cursor to Create Notebook button (target 960,700) */
        tl.to("#cur3", { x: 952, y: 696, duration: 0.5, ease: "power2.inOut" }, 1.5);
        tl.to("#cur3", { scale: 0.88, duration: 0.07 }, 2.02);
        tl.to("#cur3", { scale: 1, duration: 0.12 }, 2.09);
        tl.fromTo("#rip2", { scale: 0, opacity: 0.85 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out" }, 2.02);
        tl.to("#cur3", { opacity: 0, duration: 0.15 }, 2.35);

        /* orange strip wipe: NOTEBOOK READY */
        tl.to("#band", { xPercent: 0, duration: 0.35, ease: "power3.inOut" }, 2.6);
        tl.fromTo("#bandtxt", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 2.95);
        tl.to("#bandtxt", { opacity: 0, duration: 0.13 }, 3.4);
        tl.set("#s3-popup", { opacity: 0 }, 3.2);
        tl.set("#s3-brief", { opacity: 1 }, 3.2);
        tl.fromTo("#s3-brief img", { scale: 1 }, { scale: 1.035, duration: 1.8, ease: "none" }, 3.2);
        tl.to("#band", { xPercent: 100, duration: 0.42, ease: "power3.inOut" }, 3.55);

        window.__timelines["03-entry"] = tl;
      </script>
    </template>
  </body>
</html>
