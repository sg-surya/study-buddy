<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Anton";
          font-style: normal;
          font-weight: 400;
          src: url("assets/fonts/anton-400.woff2") format("woff2");
        }
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #fffcf8;
        }
        #root .s1bg {
          position: absolute;
          inset: 0;
          background-color: #fffcf8;
        }
        #root .hook {
          position: absolute;
          left: 140px;
          top: 250px;
        }
        #root .kline {
          font-family: "Anton", sans-serif;
          font-size: 170px;
          line-height: 0.94;
          letter-spacing: -0.005em;
          color: #201c19;
        }
        #root .kw {
          display: inline-block;
        }
        #root .dot {
          color: #ff5a1f;
        }
      </style>
      <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080">
        <div class="s1bg hatch"></div>
        <div class="hook">
          <div class="kline"><span class="kw">YOUR</span> <span class="kw">CHATBOT</span></div>
          <div class="kline"><span class="kw">NEVER</span> <span class="kw">OPENED</span></div>
          <div class="kline"><span class="kw">YOUR</span> <span class="kw">NOTES<span class="dot">.</span></span></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#root .kw",
          { scale: 1.3, opacity: 0, y: 16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)", stagger: 0.13 },
          0.12
        );
        window.__timelines["01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
