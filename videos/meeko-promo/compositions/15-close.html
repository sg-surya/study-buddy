<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Anton"; font-style: normal; font-weight: 400; src: url("assets/fonts/anton-400.woff2") format("woff2"); }
        @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 400; src: url("assets/fonts/sg-400.woff2") format("woff2"); }
        @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 500; src: url("assets/fonts/sg-500.woff2") format("woff2"); }
        @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 700; src: url("assets/fonts/sg-700.woff2") format("woff2"); }
        #r15 { position: absolute; inset: 0; background: #fffcf8; overflow: hidden; }
        #r15 .wrap { position: absolute; inset: 0; }
        #r15 .eb { position: absolute; left: 0; top: 210px; width: 1920px; text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 6px; color: #cc491a; }
        #r15 .logo { position: absolute; left: 0; top: 268px; width: 1920px; text-align: center; font-family: "Anton"; font-size: 190px; line-height: 1; color: #201c19; letter-spacing: 3px; }
        #r15 .logo .dot { color: #ff5a1f; }
        #r15 .tag1, #r15 .tag2 { position: absolute; top: 520px; width: 1920px; text-align: center; font-size: 34px; font-weight: 500; color: #201c19; }
        #r15 .tag2 { top: 572px; color: #ff5a1f; font-weight: 700; }
        #r15 .chip { position: absolute; left: 50%; top: 666px; margin-left: -348px; width: 696px; text-align: center; background: #201c19; padding: 18px 0; font-size: 17px; font-weight: 700; letter-spacing: 4px; color: #fffcf8; }
        #r15 .band { position: absolute; left: 0; bottom: 0; width: 1920px; height: 130px; background: #ff5a1f; overflow: hidden; }
        #r15 .band .hx { position: absolute; inset: 0; }
        #r15 .band .t1 { position: absolute; left: 64px; top: 46px; font-size: 25px; font-weight: 500; letter-spacing: 2px; color: #201c19; }
        #r15 .band .t2 { position: absolute; right: 64px; top: 48px; font-size: 21px; font-weight: 700; letter-spacing: 3px; color: #201c19; }
      </style>
      <div id="r15" data-composition-id="15-close" data-width="1920" data-height="1080">
        <div class="wrap" id="s15-wrap">
          <div class="eb" id="s15-eb">INTRODUCING</div>
          <div class="logo" id="s15-logo">MEEKO<span class="dot">.</span></div>
          <div class="tag1" id="s15-tag1">Learn from your notes.</div>
          <div class="tag2" id="s15-tag2">Verify every answer.</div>
          <div class="chip" id="s15-chip">HACKDAY 2026 · PS-01 · TRACK 1 · GEMMA 4</div>
        </div>
        <div class="band" id="s15-band">
          <div class="hx hatch"></div>
          <div class="t1" id="s15-bt">evidence-first study · page-tagged answers · honest NOT_FOUND</div>
          <div class="t2" id="s15-bt2">MEEKO · STUDY COMPANION</div>
        </div>
      </div>
      <script>
        gsap.set("#s15-band", { scaleY: 0 });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s15-eb", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.25);
        tl.fromTo("#s15-logo", { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.5)", transformOrigin: "50% 60%" }, 0.45);
        tl.fromTo("#s15-tag1", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.3);
        tl.fromTo("#s15-tag2", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.0);
        tl.fromTo("#s15-chip", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.2);
        tl.to("#s15-band", { scaleY: 1, duration: 0.5, ease: "power3.out", transformOrigin: "50% 100%" }, 4.3);
        tl.fromTo("#s15-bt", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 4.9);
        tl.fromTo("#s15-bt2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 5.1);
        tl.fromTo("#s15-wrap", { scale: 1 }, { scale: 1.025, duration: 7.5, ease: "none", transformOrigin: "50% 45%" }, 5.0);
        window.__timelines["15-close"] = tl;
      </script>
    </template>
  </body>
</html>
