<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Anton"; font-style: normal; font-weight: 400; src: url("assets/fonts/anton-400.woff2") format("woff2"); }
        @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 400; src: url("assets/fonts/sg-400.woff2") format("woff2"); }
        @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 500; src: url("assets/fonts/sg-500.woff2") format("woff2"); }
        @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 700; src: url("assets/fonts/sg-700.woff2") format("woff2"); }
        #r08 { position: absolute; inset: 0; background: #fffcf8; overflow: hidden; }
        #r08 .head { position: absolute; left: 0; top: 110px; width: 1920px; text-align: center; font-family: "Anton"; font-size: 96px; color: #201c19; letter-spacing: 1px; }
        #r08 .line { position: absolute; left: 210px; top: 556px; width: 1500px; height: 4px; background: #201c19; }
        #r08 .node { position: absolute; top: 544px; width: 28px; height: 28px; background: #ff5a1f; border: 6px solid #fffcf8; border-radius: 50%; box-shadow: 0 0 0 3px #201c19; }
        #r08 .n1 { left: 320px; } #r08 .n2 { left: 780px; } #r08 .n3 { left: 1240px; } #r08 .n4 { left: 1670px; }
        #r08 .val { position: absolute; top: 400px; font-family: "Anton"; font-size: 74px; color: #201c19; width: 320px; text-align: center; }
        #r08 .v1 { left: 194px; } #r08 .v2 { left: 654px; } #r08 .v3 { left: 1114px; } #r08 .v4 { left: 1528px; font-size: 56px; top: 414px; color: #ff5a1f; }
        #r08 .lab { position: absolute; top: 618px; font-size: 15px; font-weight: 700; letter-spacing: 4px; color: #201c19; width: 320px; text-align: center; }
        #r08 .l1 { left: 194px; } #r08 .l2 { left: 654px; } #r08 .l3 { left: 1114px; } #r08 .l4 { left: 1528px; color: #ff5a1f; }
        #r08 .sub { position: absolute; top: 654px; font-size: 17px; color: #716a65; width: 320px; text-align: center; }
        #r08 .s1 { left: 194px; } #r08 .s2 { left: 654px; } #r08 .s3 { left: 1114px; } #r08 .s4 { left: 1528px; }
        #r08 .foot { position: absolute; left: 50%; bottom: 130px; width: 760px; margin-left: -380px; text-align: center; font-size: 23px; font-weight: 500; color: #201c19; letter-spacing: 1px; }
        #r08 .ring { position: absolute; left: 1664px; top: 538px; width: 40px; height: 40px; border-radius: 50%; border: 4px solid #ff5a1f; }
      </style>
      <div id="r08" data-composition-id="08-process" data-width="1920" data-height="1080">
        <div class="head" id="s08-head">PAGE BY PAGE.</div>
        <div class="line" id="s08-line"></div>

        <div class="node n1" id="s08-n1"></div>
        <div class="node n2" id="s08-n2"></div>
        <div class="node n3" id="s08-n3"></div>
        <div class="node n4" id="s08-n4"></div>

        <div class="val v1" id="s08-v1">44</div>
        <div class="val v2" id="s08-v2">46</div>
        <div class="val v3" id="s08-v3">MATCH</div>
        <div class="val v4" id="s08-v4">GEMMA 4</div>

        <div class="lab l1" id="s08-la1">PAGES READ</div>
        <div class="lab l2" id="s08-la2">CHUNKS</div>
        <div class="lab l3" id="s08-la3">RELEVANT PASSAGES</div>
        <div class="lab l4" id="s08-la4">GROUNDED ANSWER</div>

        <div class="sub s1" id="s08-su1">one by one</div>
        <div class="sub s2" id="s08-su2">page-tagged pieces</div>
        <div class="sub s3" id="s08-su3">retrieved for the question</div>
        <div class="sub s4" id="s08-su4">written only from evidence</div>

        <div class="ring" id="s08-ring"></div>
        <div class="foot" id="s08-foot">answers are generated only from your material</div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s08-head", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
        tl.fromTo("#s08-line", { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power2.inOut", transformOrigin: "0% 50%" }, 1.0);

        const nodes = ["1", "2", "3", "4"];
        nodes.forEach((n, i) => {
          const t = 1.3 + i * 0.8;
          tl.fromTo(`#s08-n${n}`, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.4)", transformOrigin: "50% 50%" }, t);
          tl.fromTo(`#s08-v${n}`, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.1);
          tl.fromTo(`#s08-la${n}`, { opacity: 0 }, { opacity: 1, duration: 0.35 }, t + 0.22);
          tl.fromTo(`#s08-su${n}`, { opacity: 0 }, { opacity: 1, duration: 0.35 }, t + 0.34);
        });

        tl.fromTo("#s08-ring", { scale: 0.4, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 0.7, ease: "power2.out", transformOrigin: "50% 50%" }, 4.6);
        tl.fromTo("#s08-foot", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.6);
        window.__timelines["08-process"] = tl;
      </script>
    </template>
  </body>
</html>
