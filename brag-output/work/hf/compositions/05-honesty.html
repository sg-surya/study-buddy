<!doctype html>

  <body>
    <template>
      <style>

          left: 328px;

      <div id="root" data-composition-id="05-honesty" data-width="1920" data-height="1080">

        <div class="s5type">
          <div class="s5l" id="s5l1">Not in your notes?</div>

        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s5l1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.15);
        tl.fromTo("#s5l2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.55);
        tl.fromTo("#s5nf", { scale: 1.14 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.95);
        tl.fromTo("#s5card", { y: 64, opacity: 0, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.8);
        window.__timelines["05-honesty"] = tl;
